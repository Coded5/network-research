[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "propagation-lab"
version = "0.1.0"
description = "Static wireless signal propagation experiments powered by OMNeT++ and INET"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "pydantic>=2.10,<3",
  "streamlit>=1.49,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
propagation-lab = "propagation_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: evaluates real OMNeT++/INET C++ propagation models"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
